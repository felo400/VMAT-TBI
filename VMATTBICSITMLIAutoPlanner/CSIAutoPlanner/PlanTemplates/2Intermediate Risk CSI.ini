%ADAPTADO A LA NOMENCLATURA DEL SERVICIO (estructuras en español, Der/Izq). DOSIS Y RESTRICCIONES = STANFORD: REVISAR CON FISICA/RADIOTERAPEUTA
template name=Intermediate Risk CSI (2340cGy+3060cGy boost)
%dose per fraction(cGy) and num fractions
initial dose per fraction=180
initial num fx=13
%boost dose per fraction and num fx
boost dose per fraction=180
boost num fx=17
%
add prescription target{PTV_CSI,2340,CSI-init}
add prescription target{PTV_Boost,5400,CSI-bst}
%
% target derivations
add target derivation{Cerebro,[uniform,0],CopyContractExpand,CTV_Brain,false}
add target derivation{CTV_Brain,[uniform,0.5],CopyContractExpand,PTV_Brain,false}
add target derivation{Medula,[asymmetric,outer,1.0,0.5,1.5,1.0,1.0,1.0],CopyContractExpand,CTV_Spine,false}
add target derivation{CTV_Spine,[uniform,0.5],CopyContractExpand,PTV_Spine,false}
add target derivation{PTV_Brain,[uniform,0.0],Union,PTV_Spine,[uniform,0.0],PTV_CSI,false}
add target derivation{PTV_CSI,[uniform,0.0],Intersection,BODY,[uniform,-0.5],PTV_CSI,false}
%
%target to create ring from, margin, thickness, dose level, dose value presentation (cGy or Relative)
create ring{PTV_CSI,1.5,2.0,1170}
create ring{PTV_Boost,1.5,2.0,1530}
%
crop and contour overlap with targets{Quiasma}
crop and contour overlap with targets{N Optico Der}
crop and contour overlap with targets{N Optico Izq}
crop and contour overlap with targets{Tallo Cerebral}
crop and contour overlap with targets{Coclea Der}
crop and contour overlap with targets{Coclea Izq}
%
% special optimization structures
add special optimization structure{CONTROL,TS_Eyes}
add special optimization structure{CONTROL,TS_Lenses}
add special optimization structure{CONTROL,TS_ArmsAvoid}
%
% general optimization structures
add opt structure derivation{Tallo Cerebral,[uniform,0.3],CopyContractExpand,Tallo_PRV,false}
add opt structure derivation{Quiasma,[uniform,0.3],CopyContractExpand,Quiasma_PRV,false}
add opt structure derivation{Coclea Der,[uniform,0.3],CopyContractExpand,Coclea Der_PRV,false}
add opt structure derivation{Coclea Izq,[uniform,0.3],CopyContractExpand,Coclea Izq_PRV,false}
add opt structure derivation{N Optico Der,[uniform,0.3],CopyContractExpand,N Optico D_PRV,false}
add opt structure derivation{N Optico Izq,[uniform,0.3],CopyContractExpand,N Optico I_PRV,false}
%
%structure ID, constraint type, dose (cGy), volume (%), priority
add init opt constraint{PTV_CSI,Lower,2340.0,100.0,100}
