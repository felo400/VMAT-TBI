add plan objective{Tiroides,Mean,50.0,0.0,Relative}
add plan objective{Pulmon Der,Mean,20.8,0.0,Relative}
add plan objective{Pulmon Izq,Mean,20.8,0.0,Relative}
add plan objective{Corazon,Mean,33.3,0.0,Relative}
add plan objective{Esofago,Mean,79.2,0.0,Relative}
add plan objective{Submand Der,Mean,37.5,0.0,Relative}
add plan objective{Submand Izq,Mean,37.5,0.0,Relative}
add plan objective{Laringe,Mean,62.5,0.0,Relative}
add plan objective{TS_ring600,Upper,50.0,0.0,Relative}
