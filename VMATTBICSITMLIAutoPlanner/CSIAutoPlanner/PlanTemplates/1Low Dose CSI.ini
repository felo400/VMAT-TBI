add init opt constraint{Coclea Izq,Upper,1250.0,0.0,60}
add init opt constraint{Coclea Der,Mean,1200.0,0.0,60}
add init opt constraint{Coclea Izq,Mean,1200.0,0.0,60}
add init opt constraint{Parotida Der,Mean,400.0,0.0,60}
add init opt constraint{Parotida Izq,Mean,400.0,0.0,60}
add init opt constraint{Hipofisis,Upper,1250.0,0.0,60}
add init opt constraint{Ojo Der,Upper,1250.0,0.0,60}
add init opt constraint{Ojo Izq,Upper,1250.0,0.0,60}
add init opt constraint{Ojo Der,Mean,1000.0,0.0,60}
add init opt constraint{Ojo Izq,Mean,1000.0,0.0,60}
add init opt constraint{Cristalino Der,Upper,800.0,0.0,60}
add init opt constraint{Cristalino Izq,Upper,800.0,0.0,60}
add init opt constraint{Riñon Der,Mean,250.0,0.0,80}
add init opt constraint{Riñon Izq,Mean,250.0,0.0,80}
add init opt constraint{Ovarios,Mean,120.0,0.0,60}
add init opt constraint{Ovarios,Upper,250.0,0.0,60}
add init opt constraint{Cav Oral,Mean,300.0,0.0,60}
add init opt constraint{Tiroides,Mean,600.0,0.0,60}
add init opt constraint{Pulmon Der,Mean,250.0,0.0,80}
add init opt constraint{Pulmon Izq,Mean,250.0,0.0,80}
add init opt constraint{Corazon,Mean,400.0,0.0,50}
add init opt constraint{Esofago,Mean,950.0,0.0,50}
add init opt constraint{Submand Der,Mean,450.0,0.0,50}
add init opt constraint{Submand Izq,Mean,450.0,0.0,50}
add init opt constraint{Laringe,Mean,750.0,0.0,50}
add init opt constraint{TS_ArmsAvoid,Upper,100.0,0.0,100}
add init opt constraint{TS_Eyes,Upper,950.0,0.0,50}
add init opt constraint{TS_Lenses,Upper,600.0,0.0,50}
%
%plan objectives
%%NOTE: IT IS IMPORTANT THAT THE PTV STRUCTURE HAS THE ID ENTERED AS 'targetId'! THIS WILL BE OVERWRITTEN WITH THE 
%ACTUAL TARGET STRUCTURE ID AT RUNTIME
%structure ID, constraint type, dose (% or cGy), volume (%), dose value presentation
add plan objective{PTV_CSI,Lower,100.0,95.0,Relative}
add plan objective{PTV_CSI,Upper,110.0,0.0,Relative}
add plan objective{Tallo Cerebral,Upper,104.0,0.0,Relative}
