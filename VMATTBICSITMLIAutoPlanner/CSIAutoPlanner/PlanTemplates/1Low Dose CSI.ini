add plan objective{Ojo Izq,Mean,83.3,0.0,Relative}
add plan objective{Cristalino Der,Upper,66.7,0.0,Relative}
add plan objective{Cristalino Izq,Upper,66.7,0.0,Relative}
add plan objective{Riñon Der,Mean,20.8,0.0,Relative}
add plan objective{Riñon Izq,Mean,20.8,0.0,Relative}
