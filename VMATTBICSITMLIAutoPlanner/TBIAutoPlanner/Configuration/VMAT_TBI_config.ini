%VMAT TBI configuration file
%=====================================================================================================
%ADAPTADO PARA ECLIPSE 16.1 - Configuracion local del servicio
%  * Las lineas que empiezan con % son comentarios. NO deje lineas vacias.
%  * Use PUNTO como separador decimal (390.0, no 390,0).
%  * Reemplace CAMBIAR_ID_LINAC por el ID exacto del acelerador tal como aparece en Eclipse
%    (Beam Configuration / Machine ID). Puede agregar una linea "add linac{...}" por cada equipo.
%  * Si "calculation model" u "optimization model" quedan vacios (o el nombre no existe en su Eclipse),
%    el programa le mostrara la lista de modelos disponibles para que escoja uno.
%  * La exportacion de CT / importacion de RTSTRUCT por DICOM es OPCIONAL. Solo descomente esas lineas
%    si va a usar la segmentacion automatica externa (requiere configurar los daemons DICOM de ARIA).
%=====================================================================================================
%EAS 03/13/23
%NOTE: THERE CANNOT BE EMPTY LINES IN THIS FILE! OTHERWISE, THE SCRIPT WILL NOT BE ABLE TO PARSE THE INFORMATION!
%ALL LENGTHS ARE IN CM
%
%documentation path
documentation path=
%
%close progress windows on finish
close progress windows on finish=true
%
%default course ID
course Id=VMAT TBI
%
%linacs and available beam energies
%Acelerador del servicio (Machine ID en Eclipse 16.1). Puede agregar mas lineas add linac{...}
add linac{TrueBeamSN3556}
add beam energy{6X}
add beam energy{10X}
add beam energy{6FFF}
add beam energy{10FFF}
%
%photon beam calculation model
%Nombre exacto del modelo de calculo en su Eclipse 16.1 (ej. AAA_1610 o AcurosXB_1610 - verifique el nombre en Eclipse). Vacio = escoger de la lista
calculation model=
%Nombre exacto del optimizador VMAT en su Eclipse 16.1 (ej. PO_1610 - verifique el nombre en Eclipse). Vacio = escoger de la lista
optimization model=
%
%use GPU during dose calculation? Machine must support GPU calculation. Only applies to AXB (N/A for AAA). Options are 'Yes', 'No'
%use GPU for dose calculation=Yes
%use GPU during optimization? Machine must support GPU use for optimization. Applies to PO optimizer (maybe others). Options are 'Yes', 'No'
%use GPU for optimization=Yes
%
% What MR level should the optimizer restart at from intermediate dose
MR level restart=MR3
%
%
%flash parameters
use flash by default=true
default flash margin=0.5
%target margin
default target margin=0.5
%
%
%default number of beams per isocenter (from sup to inf)
beams per iso={4,3,3,2,2,2}
%
%settings for contouring field overlap
contour field overlap=true
contour field overlap margin=1.0
%
%collimator rotations for the beams (the order of these matters)
%Varian IEC 1217 coordinates
collimator rotations={3.0,357.0,87.0,93.0}
%
%Beam jaw positions (the order of these jaw positions correspond to the order of the collimator rotations specified above)
%The number of entries here should match the number of collimator rotation entries
%syntax: x1, y1, x2, y2
add jaw position{-20.0,-200.0,200.0,200.0}
add jaw position{-200.0,-200.0,20.0,200.0}
add jaw position{-200.0,-200.0,0.0,200.0}
add jaw position{0.0,-200.0,200.0,200.0}
%
% in mm
minimum field overlap=20
%
%check for couch collision with linac
%will check if the table-top to isocenter distance is > 17.5 cm. If so, it will ask the user if they want to override the isocenter y position 
%to a max of 17.5 cm
check couch collision=true
%
%
%
%crear DRR para cada campo al colocar los campos. En Eclipse 16.1 los campos con DRR no se pueden borrar desde el script
%y la separacion automatica de planes falla. Recomendado: false (crear los DRR a mano en los planes finales)
create DRRs=false
%
