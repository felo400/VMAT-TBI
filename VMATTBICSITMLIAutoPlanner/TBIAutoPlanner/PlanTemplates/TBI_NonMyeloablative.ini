:begin template case configuration:
%ADAPTADO A LA NOMENCLATURA DEL SERVICIO (estructuras en español, Der/Izq). DOSIS Y RESTRICCIONES = STANFORD: REVISAR CON FISICA/RADIOTERAPEUTA
template name=NonMyeloablative TBI (200 cGy)
%% nonmyeloablative vmat tbi plan template
% dose per fraction and number of fractions
dose per fraction=200
num fx=1
% add targets
% target id, Rx dose (cGy), numFx, plan id
add prescription target{PTV_Body,200,VMAT-TBI}
%
% targets
add target derivation{BODY,[uniform,-0.5],CopyContractExpand,PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Cristalino Der,[uniform,0.1],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Cristalino Izq,[uniform,0.1],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Pulmon Der,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Pulmon Izq,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Der,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Izq,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Cerebro,[uniform,-0.5],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Tiroides,[uniform,0],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Testiculos,[uniform,2.0],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Ovarios,[uniform,1.5],PTV_Body,false}
%add target derivation{PTV_Body,[uniform,0],crop,Liver,[uniform,0.3],PTV_Body,false}
%
%optimization structures
add opt structure derivation{Pulmon Der,[uniform,-1.0],CopyContractExpand,Pulmon Der-1cm,false}
add opt structure derivation{Pulmon Izq,[uniform,-1.0],CopyContractExpand,Pulmon Izq-1cm,false}
add opt structure derivation{Pulmon Der,[uniform,-2.0],CopyContractExpand,Pulmon Der-2cm,false}
add opt structure derivation{Pulmon Izq,[uniform,-2.0],CopyContractExpand,Pulmon Izq-2cm,false}
add opt structure derivation{Riñon Der,[uniform,-1.0],CopyContractExpand,Riñon Der-1cm,false}
add opt structure derivation{Riñon Izq,[uniform,-1.0],CopyContractExpand,Riñon Izq-1cm,false}
add opt structure derivation{Cerebro,[uniform,-0.5],CopyContractExpand,Cerebro-0.5cm,false}
add opt structure derivation{Cerebro,[uniform,-1.0],CopyContractExpand,Cerebro-1cm,false}
add opt structure derivation{Cerebro,[uniform,-2.0],CopyContractExpand,Cerebro-2cm,false}
add opt structure derivation{Cerebro,[uniform,-3.0],CopyContractExpand,Cerebro-3cm,false}
%
add opt constraint{PTV_Body,Lower,200.0,100.0,100}
add opt constraint{PTV_Body,Upper,202.0,0.0,100}
add opt constraint{PTV_Body,Lower,201.0,98.0,100}
add opt constraint{Riñon Der,Mean,120.0,0.0,80}
add opt constraint{Riñon Izq,Mean,120.0,0.0,80}
add opt constraint{Riñon Der-1cm,Mean,75.0,0.0,50}
add opt constraint{Riñon Izq-1cm,Mean,75.0,0.0,50}
add opt constraint{Pulmon Der,Mean,75.0,0.0,90}
add opt constraint{Pulmon Izq,Mean,75.0,0.0,90}
add opt constraint{Pulmon Der-1cm,Mean,50.0,0.0,80}
add opt constraint{Pulmon Izq-1cm,Mean,50.0,0.0,80}
add opt constraint{Pulmon Der-2cm,Mean,25.0,0.0,70}
add opt constraint{Pulmon Izq-2cm,Mean,25.0,0.0,70}
add opt constraint{Ovarios,Mean,50.0,0.0,50}
add opt constraint{Ovarios,Upper,75.0,0.0,70}
add opt constraint{Testiculos,Mean,50.0,0.0,50}
add opt constraint{Testiculos,Upper,75.0,0.0,70}
add opt constraint{Cristalino Der,Upper,190.0,0.0,50}
add opt constraint{Cristalino Izq,Upper,190.0,0.0,50}
add opt constraint{Cerebro,Mean,150.0,0.0,60}
add opt constraint{Cerebro-1cm,Mean,100.0,0.0,50}
add opt constraint{Cerebro-2cm,Mean,75.0,0.0,50}
add opt constraint{Cerebro-3cm,Mean,50.0,0.0,50}
add opt constraint{Cav Intestinal,Upper,201.0,0.0,50}
add opt constraint{Tiroides,Mean,100.0,0.0,50}
%
%plan objectives
add plan objective{PTV_Body,Lower,100.0,90.0,Relative}
add plan objective{PTV_Body,Upper,120.0,0.0,Relative}
add plan objective{PTV_Body,Upper,110.0,5.0,Relative}
add plan objective{Pulmon Der,Mean,60.0,0.0,Relative}
add plan objective{Pulmon Izq,Mean,60.0,0.0,Relative}
add plan objective{Pulmon Der-1cm,Mean,45.0,0.0,Relative}
add plan objective{Pulmon Izq-1cm,Mean,45.0,0.0,Relative}
add plan objective{Riñon Der,Upper,105.0,0.0,Relative}
add plan objective{Riñon Izq,Upper,105.0,0.0,Relative}
add plan objective{Riñon Der,Mean,60.0,0.0,Relative}
add plan objective{Riñon Izq,Mean,60.0,0.0,Relative}
add plan objective{Cav Intestinal,Upper,105.0,0.0,Relative}
add plan objective{Testiculos,Upper,100.0,0.0,Relative}
add plan objective{Testiculos,Mean,25.0,0.0,Relative}
add plan objective{Ovarios,Upper,100.0,0.0,Relative}
add plan objective{Ovarios,Mean,25.0,0.0,Relative}
add plan objective{Cerebro-1cm,Mean,75.0,0.0,Relative}
add plan objective{Tiroides,Mean,75.0,0.0,Relative}
%
%
%be careful when adding these. It significantly slows down the plan quality evaluation at the end of each loop iteration
%ID, lower dose level, upper dose level (N/A for cooler structures), volume (%), priority, conditions 
%(empty array indicates ts structure should always be added). All conditions are AND
add optimization TS structure{TS_cooler120,110.0,108.0,0.0,80,{Dmax > 130 %}}
add optimization TS structure{TS_cooler110,110.0,108.0,0.0,70,{Dmax > 120 %}}
add optimization TS structure{TS_cooler105,105.0,105.0,2.0,60,{finalOpt,Dmax > 110 %}}
add optimization TS structure{TS_cooler102,105.0,102.0,1.0,60,{finalOpt}}
add optimization TS structure{TS_heater90,90.0,100.0,100.0,60,{Dmax > 115 %}}
add optimization TS structure{TS_heater80,80.0,90.0,100.0,70,{Dmax > 120 %}}
add optimization TS structure{TS_heater70,70.0,80.0,100.0,80,{Dmax > 130 %,V110 > 20.0 %}}
%
%additional plan dose info that should be printed after each iteration of the loop
%structure id (or can put '<plan>' to get the plan dose value), metric requested (Dmax, Dmin, D<vol %>, V<dose %>), return value representation (dose or volume as absolute or relative)
add requested plan metric{<plan>,Dmax,%}
add requested plan metric{<target>,Dmax,%}
add requested plan metric{<target>,Dmin,%}
add requested plan metric{<target>,DoseAtVolume,90,%,%}
add requested plan metric{<target>,VolumeAtDose,90,%,%}
add requested plan metric{<target>,VolumeAtDose,95,%,%}
add requested plan metric{<target>,VolumeAtDose,110,%,%}
add requested plan metric{<target>,VolumeAtDose,120,%,%}
%
:end template case configuration: