add opt structure derivation{Riñon Izq,[uniform,-1.0],CopyContractExpand,Riñon Izq-1cm,false}
add opt structure derivation{Riñon Izq,[asymmetric,outer,0.5,2.0,2.0,2.0,2.0,2.0],CopyContractExpand,Kidney_Block_L,false}
add opt structure derivation{Riñon Der,[asymmetric,outer,0.5,2.0,2.0,2.0,2.0,2.0],CopyContractExpand,Kidney_Block_R,false}
