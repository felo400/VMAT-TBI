add target derivation{PTV_Body,[uniform,0],crop,Cristalino Izq,[uniform,0.1],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Pulmon Der,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Pulmon Izq,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Der,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Izq,[uniform,0.3],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Izq,[asymmetric,outer,0.5,2.0,2.0,2.0,2.0,2.0],PTV_Body,false}
add target derivation{PTV_Body,[uniform,0],crop,Riñon Der,[asymmetric,outer,0.5,2.0,2.0,2.0,2.0,2.0],PTV_Body,false}
