:begin template case configuration:
%ADAPTADO A LA NOMENCLATURA DEL SERVICIO (estructuras en español, Der/Izq). DOSIS Y RESTRICCIONES = STANFORD: REVISAR CON FISICA/RADIOTERAPEUTA
%% scleroderma trial vmat tbi plan template
template name=Scleroderma trial (800 cGy)
% dose per fraction and number of fractions
dose per fraction=200
num fx=4
% add targets
% target id, Rx dose (cGy), plan id
add prescription target{PTV_Body,800,VMAT-TBI}
%
%
%target derivations
add target derivation{BODY,[uniform,-0.5],CopyContractExpand,PTV_Body,false}
